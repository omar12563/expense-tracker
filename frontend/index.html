
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand">Expense Tracker</span>
    </div>
  </nav>

  <main class="container py-4">

    <div id="alertContainer"></div>

    <div class="summary-grid">
      <div class="summary-card card text-bg-primary">
        <div class="card-body">
          <h5>Total Amount</h5>
          <h2 id="totalAmount">0.00</h2>
        </div>
      </div>

      <div class="summary-card card text-bg-success">
        <div class="card-body">
          <h5>Number of Expenses</h5>
          <h2 id="expenseCount">0</h2>
        </div>
      </div>

      <div class="summary-card card text-bg-danger">
        <div class="card-body">
          <h5>Highest Expense</h5>
          <h2 id="highestExpense">0.00</h2>
        </div>
      </div>
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <h3>Add Expense</h3>

        <form id="expenseForm">
          <div class="row g-3">

            <div class="col-md-6">
              <label for="title" class="form-label">Title</label>
              <input type="text" id="title" class="form-control">
            </div>

            <div class="col-md-6">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" id="amount" class="form-control" step="0.01">
            </div>

            <div class="col-md-6">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select">
                <option value="">Select category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="col-md-6">
              <label for="date" class="form-label">Date</label>
              <input type="date" id="date" class="form-control">
            </div>

          </div>

          <button type="submit" class="btn btn-primary mt-3">
            Add Expense
          </button>
        </form>
      </div>
    </div>

    <div class="mb-3">
      <label for="categoryFilter" class="form-label">Filter by category</label>

      <select id="categoryFilter" class="form-select">
        <option value="All">All</option>
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Bills">Bills</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div id="loadingSpinner" class="text-center my-4 d-none">
      <div class="spinner-border text-primary" role="status"></div>
      <p>Loading expenses...</p>
    </div>

    <div class="table-container">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="expensesTableBody"></tbody>
      </table>
    </div>

  </main>

  <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Edit Expense</h5>

          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Close">
          </button>
        </div>

        <div class="modal-body">

          <div class="mb-3">
            <label for="editTitle" class="form-label">Title</label>
            <input type="text" id="editTitle" class="form-control">
          </div>

          <div class="mb-3">
            <label for="editAmount" class="form-label">Amount</label>
            <input type="number" id="editAmount" class="form-control" step="0.01">
          </div>

          <div class="mb-3">
            <label for="editCategory" class="form-label">Category</label>

            <select id="editCategory" class="form-select">
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="editDate" class="form-label">Date</label>
            <input type="date" id="editDate" class="form-control">
          </div>

        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>

          <button type="button" id="saveEditButton" class="btn btn-primary">
            Save Changes
          </button>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
